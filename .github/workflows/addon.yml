name: Add-on

on:
  push:
    branches: [main, edge]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint add-on config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Checks config.yaml against the Supervisor schema, the same rules the add-on store applies.
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./vicohome_mqtt

  build:
    name: Build image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep in step with `arch` in config.yaml.
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./vicohome_mqtt
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: vicohome_mqtt:ci-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke-test the image
        run: |
          docker run --rm --platform ${{ matrix.platform }} --entrypoint python3 vicohome_mqtt:ci-${{ matrix.arch }} \
            -c "import paho.mqtt, requests; import vicohome, clips, tracker; print('ok')"
          docker run --rm --platform ${{ matrix.platform }} --entrypoint ffmpeg vicohome_mqtt:ci-${{ matrix.arch }} -version
          docker run --rm --platform ${{ matrix.platform }} --entrypoint ffprobe vicohome_mqtt:ci-${{ matrix.arch }} -version

  apparmor:
    name: AppArmor profile (end-to-end, enforced)
    # GitHub's Ubuntu runners have AppArmor on, like Home Assistant OS. Runs the fake-cloud
    # end-to-end test inside the add-on image with the profile enforced, then fails on any denial.
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./vicohome_mqtt
          platforms: linux/amd64
          push: false
          load: true
          tags: vicohome_mqtt:apparmor
          cache-from: type=gha,scope=amd64
      - name: Load the profile
        run: |
          sudo apparmor_parser -r -W vicohome_mqtt/apparmor.txt
          sudo grep -x 'vicohome_mqtt (enforce)' /sys/kernel/security/apparmor/profiles
      - name: Start an anonymous MQTT broker
        run: |
          # A bridged network, like Supervisor's add-on network; the broker plays core-mosquitto.
          docker network create addons
          docker run -d --name mqtt --network addons -p 1883:1883 eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf
          for i in $(seq 1 20); do nc -z 127.0.0.1 1883 && exit 0; sleep 1; done
          docker logs mqtt; exit 1
      - name: Put a fake camera on a LAN the add-on network can only reach through NAT
        run: |
          # The camera's namespace has no route back to the add-on network, like a real camera.
          sudo ip netns add cam
          sudo ip link add veth-lan type veth peer name veth-cam
          sudo ip link set veth-cam netns cam
          sudo ip addr add 192.0.2.1/24 dev veth-lan
          sudo ip link set veth-lan up
          sudo ip -n cam addr add 192.0.2.2/24 dev veth-cam
          sudo ip -n cam link set veth-cam up
          sudo ip -n cam link set lo up
          sudo sysctl -qw net.ipv4.ip_forward=1
          sudo iptables -I FORWARD -o veth-lan -j ACCEPT
          sudo iptables -I FORWARD -i veth-lan -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          python3 -m venv "$RUNNER_TEMP/cam-venv"
          "$RUNNER_TEMP/cam-venv/bin/pip" install -q "$(grep -E '^aiortc==' vicohome_mqtt/requirements.txt)"
      - name: Run the add-on's mounts and checks under the profile
        run: |
          mkdir -p "$RUNNER_TEMP"/{data,media,ha/www,ice}
          # Supervisor's folders are root-owned; root in the container has no DAC override.
          chmod 777 "$RUNNER_TEMP"/{data,media,ha,ha/www,ice}
          echo "# test" > "$RUNNER_TEMP/ha/configuration.yaml"
          sudo dmesg --clear || true
          run() {
            # As Supervisor starts it: --init, a bridged network, the same mounts, the profile.
            docker run --rm --init --network addons --security-opt apparmor=vicohome_mqtt \
              -v "$RUNNER_TEMP/data:/data" -v "$RUNNER_TEMP/media:/media" -v "$RUNNER_TEMP/ha:/homeassistant" \
              -v "$RUNNER_TEMP/ice:/ice" -v "$PWD/tests:/app/tests:ro" -e MQTT_HOST=mqtt -e BRIDGE_APP=/app \
              vicohome_mqtt:apparmor "$@"
          }
          run python3 /app/tests/apparmor_ice_check.py
          run python3 /app/tests/e2e_fake_cloud.py
          # The SD card link without host networking: ICE through the host's NAT to the camera.
          sudo ip netns exec cam timeout 120 "$RUNNER_TEMP/cam-venv/bin/python" tests/nat_ice_check.py camera "$RUNNER_TEMP/ice" &
          run python3 /app/tests/nat_ice_check.py bridge /ice
          wait
      - name: No AppArmor denials
        if: always()
        run: |
          if sudo dmesg | grep 'apparmor="DENIED"' | grep 'profile="vicohome_mqtt'; then
            echo "::error file=vicohome_mqtt/apparmor.txt::The profile denied something the add-on did (lines above)"
            exit 1
          fi
          echo "no denials"
