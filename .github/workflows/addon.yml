name: Add-on

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint add-on config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Checks config.yaml against the Supervisor schema, the same rules the add-on store applies.
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./vicohome_mqtt

  build:
    name: Build image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep in step with `arch` in config.yaml.
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./vicohome_mqtt
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: vicohome_mqtt:ci-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke-test the image
        run: |
          docker run --rm --platform ${{ matrix.platform }} --entrypoint python3 vicohome_mqtt:ci-${{ matrix.arch }} \
            -c "import paho.mqtt, requests; import vicohome, clips, tracker; print('ok')"
          docker run --rm --platform ${{ matrix.platform }} --entrypoint ffmpeg vicohome_mqtt:ci-${{ matrix.arch }} -version
