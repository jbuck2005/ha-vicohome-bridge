name: Tests

on:
  push:
    branches: [main, edge]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # a PR is checked out as its merge commit; HEAD^1 is the base branch
      - name: Add-on version bumped (PRs into edge)
        # The edge add-on only offers an update when the version changes. Dependabot can't bump it;
        # its updates reach the edge add-on with the next bump.
        if: github.base_ref == 'edge' && github.actor != 'dependabot[bot]'
        run: |
          git diff --quiet HEAD^1 -- vicohome_mqtt/ && exit 0
          old=$(git show HEAD^1:vicohome_mqtt/config.yaml | sed -n 's/^version: "\(.*\)"/\1/p')
          new=$(sed -n 's/^version: "\(.*\)"/\1/p' vicohome_mqtt/config.yaml)
          echo "edge has $old, this PR has $new"
          if [ "$old" = "$new" ]; then
            echo "::error file=vicohome_mqtt/config.yaml::Bump the version (e.g. 0.3.6-dev.2) so the edge add-on offers this change"
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          # Matches the python:3.13 base image in the Dockerfile.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: vicohome_mqtt/requirements.txt
      - run: pip install -r vicohome_mqtt/requirements.txt pytest
      - run: pytest tests

  e2e:
    name: End-to-end (fake cloud + MQTT)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: vicohome_mqtt/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r vicohome_mqtt/requirements.txt
      - name: Create the add-on's mount points
        # The bridge uses the paths Supervisor mounts into the container.
        run: |
          sudo mkdir -p /data /media /homeassistant
          sudo chown "$USER" /data /media /homeassistant
      - name: Start an anonymous MQTT broker
        run: |
          docker run -d --name mqtt -p 1883:1883 eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf
          for i in $(seq 1 20); do nc -z 127.0.0.1 1883 && exit 0; sleep 1; done
          docker logs mqtt; exit 1
      - run: python tests/e2e_fake_cloud.py
        env:
          MQTT_HOST: 127.0.0.1
