name: "Vicohome MQTT Bridge"
version: "0.4.4-dev.4"
slug: "vicohome_mqtt"
description: "Vicohome bird-feeder cameras in Home Assistant over MQTT: newest bird, snapshot image, visit events, battery and Wi-Fi."
url: "https://github.com/jbuck2005/ha-vicohome-bridge"
arch:
  - aarch64
  - amd64
services:
  - mqtt:need
map:
  - type: media
    read_only: false
  - type: homeassistant_config
    read_only: false
options:
  email: ""
  password: ""
  region: "us"
  poll_interval: 60
  bootstrap_hours: 24
  image_source: "keyshot"
  save_images: true
  retention_days: 30
  motion_seconds: 60
  save_clips: true
  clip_source: "cloud_first"
  sd_fetch_hours: 1
  sd_rx_window_kb: 1024
  sd_nat_candidate: true
  sd_send_audio: true
  sd_delayed_ack: true
  visit_source: "cloud"
  sd_poll_minutes: 60
  clips_to_keep: 60
  clips_max: 600
  base_topic: "vicohome_mqtt"
  log_level: "info"
schema:
  email: email
  password: password
  region: list(us|eu)
  api_base_override: url?
  poll_interval: int(30,3600)
  bootstrap_hours: int(0,168)
  image_source: list(keyshot|image)
  save_images: bool
  media_folder: str?
  retention_days: int(0,3650)
  motion_seconds: int(5,600)
  save_clips: bool
  clip_source: list(cloud_first|sd_only|cloud_only)
  sd_fetch_hours: int(1,24)
  sd_rx_window_kb: int(64,4096)
  sd_nat_candidate: bool
  sd_send_audio: bool
  sd_delayed_ack: bool
  visit_source: list(cloud|sd_poll)
  sd_poll_minutes: int(15,1440)
  clips_to_keep: int(1,5000)
  clips_max: int(1,5000)
  clip_folder: str?
  base_topic: str
  discovery_prefix: str?
  log_level: list(debug|info|warning|error)
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
